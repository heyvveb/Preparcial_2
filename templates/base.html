<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Preparcial{% endblock %}</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f6f9;
    color: #333;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
    width: 100%;
}

.navbar {
    background: #1a1a2e;
    color: #fff;
    padding: 15px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-brand {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
}

.nav-links a {
    color: #ccc;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    transition: all 0.2s;
}

.nav-links a:hover,
.nav-links a.active {
    background: #16213e;
    color: #fff;
}

main {
    flex: 1;
    padding: 30px 0;
}

.hero {
    text-align: center;
    padding: 50px 0 30px;
}

.hero h1 {
    font-size: 2.5rem;
    color: #1a1a2e;
    margin-bottom: 8px;
}

.hero p {
    font-size: 1.1rem;
    color: #666;
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 25px;
    margin-top: 20px;
}

.card {
    background: #fff;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
}

.card h2 {
    font-size: 1.5rem;
    margin-bottom: 10px;
    color: #1a1a2e;
}

.card .count {
    font-size: 2rem;
    font-weight: 700;
    color: #0f3460;
    margin-bottom: 20px;
}

.card-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 12px;
}

.page-header h1 {
    font-size: 1.8rem;
    color: #1a1a2e;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.btn {
    display: inline-block;
    padding: 8px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    font-size: 0.9rem;
    transition: all 0.2s;
    font-weight: 500;
}

.btn-primary { background: #0f3460; color: #fff; }
.btn-primary:hover { background: #1a1a4e; }

.btn-success { background: #1b9e4a; color: #fff; }
.btn-success:hover { background: #15803d; }

.btn-warning { background: #f59e0b; color: #fff; }
.btn-warning:hover { background: #d97706; }

.btn-danger { background: #dc2626; color: #fff; }
.btn-danger:hover { background: #b91c1c; }

.btn-secondary { background: #6b7280; color: #fff; }
.btn-secondary:hover { background: #4b5563; }

.btn-search { background: #0f3460; color: #fff; }
.btn-search:hover { background: #1a1a4e; }

.btn-sm {
    padding: 5px 12px;
    font-size: 0.8rem;
}

.table-container {
    overflow-x: auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.table {
    width: 100%;
    border-collapse: collapse;
}

.table th, .table td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
}

.table th {
    background: #f9fafb;
    font-weight: 600;
    color: #374151;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.table tbody tr:hover {
    background: #f3f4f6;
}

.actions {
    display: flex;
    gap: 6px;
    align-items: center;
}

.badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 500;
}

.badge-active { background: #d1fae5; color: #065f46; }
.badge-inactive { background: #fee2e2; color: #991b1b; }

.form {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    max-width: 600px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: #374151;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 0.95rem;
    transition: border-color 0.2s;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #0f3460;
    box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.1);
}

.input-error {
    border-color: #dc2626 !important;
}

.error-msg {
    display: block;
    color: #dc2626;
    font-size: 0.85rem;
    margin-top: 4px;
}

.required {
    color: #dc2626;
    margin-left: 2px;
}

.form-checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
}

.form-checkbox input {
    width: auto;
}

.form-checkbox label {
    margin: 0;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.filter-form {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
    align-items: center;
}

.filter-input {
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 0.95rem;
}

.filter-input:focus {
    outline: none;
    border-color: #0f3460;
}

input.filter-input {
    max-width: 200px;
}

select.filter-input {
    min-width: 140px;
}

.search-form {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.search-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 0.95rem;
    max-width: 350px;
}

.search-input:focus {
    outline: none;
    border-color: #0f3460;
}

.empty-state {
    text-align: center;
    color: #9ca3af;
    padding: 40px;
    font-size: 1.1rem;
}

.footer {
    text-align: center;
    padding: 20px;
    background: #1a1a2e;
    color: #9ca3af;
    font-size: 0.9rem;
    margin-top: auto;
}
    </style>
</head>
<body>
    {% include "includes/navbar.html" %}
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>Preparcial - Heynner Velasco</p>
    </footer>
</body>
</html>
